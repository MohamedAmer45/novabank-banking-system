name: NovaBank CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: novabank-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Jest unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # No database and no server: these tests cover pure functions only, so the
    # job is deliberately independent of the smoke suite below and fails fast
    # when a rounding rule or a permission cell changes.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests with coverage
        run: npm run test:coverage

      # Reported, not gated. The total score is dominated by mutants in code
      # the unit suite deliberately does not target, so a threshold on it would
      # measure scope rather than test quality -- it would move whenever someone
      # added a function. MUTATION.md explains how to read the number.
      - name: Mutation testing
        run: |
          npm run test:mutation

          node -e '
            const r = require("./reports/mutation/mutation.json");
            let killed = 0, survived = 0, noCov = 0;
            const perFile = [];
            for (const [file, data] of Object.entries(r.files)) {
              const k = data.mutants.filter(m => m.status === "Killed").length;
              const s = data.mutants.filter(m => m.status === "Survived").length;
              const n = data.mutants.filter(m => m.status === "NoCoverage").length;
              killed += k; survived += s; noCov += n;
              if (k + s > 0) {
                perFile.push(`${require("path").basename(file)} ${((k / (k + s)) * 100).toFixed(1)}%`);
              }
            }
            const covered = ((killed / (killed + survived)) * 100).toFixed(1);
            const line = `mutation score ${covered}% of covered mutants (${killed} killed, ${survived} survived, ${noCov} not reached)`;
            console.log(line);
            console.log(`::notice title=Mutation testing::${line}; ${perFile.join("; ")}`);
          '

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

  smoke:
    name: API and ledger smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway PostgreSQL for the run, so CI never depends on the hosted
    # database and every run starts from an identical seed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novabank
          POSTGRES_PASSWORD: novabank
          POSTGRES_DB: novabank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novabank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://novabank:novabank@127.0.0.1:5432/novabank_test
      DATABASE_SSL: "false"
      QA_MODE: "true"
      PORT: "3000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: |
          npm run check
          node --check public/app.js

      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Start application
        run: |
          node server.js > /tmp/novabank.log 2>&1 &
          echo $! > /tmp/novabank.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              echo "Application is healthy."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Application did not become healthy."
          cat /tmp/novabank.log || true
          exit 1

      - name: Smoke suite
        run: npm run smoke

      - name: Ledger reconciliation
        run: npm run db:check

      - name: Server log
        if: always()
        run: cat /tmp/novabank.log || true

      - name: Stop application
        if: always()
        run: test -f /tmp/novabank.pid && kill "$(cat /tmp/novabank.pid)" || true
