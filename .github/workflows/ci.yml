name: NovaBank CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: novabank-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: API and ledger smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway PostgreSQL for the run, so CI never depends on the hosted
    # database and every run starts from an identical seed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novabank
          POSTGRES_PASSWORD: novabank
          POSTGRES_DB: novabank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novabank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://novabank:novabank@127.0.0.1:5432/novabank_test
      DATABASE_SSL: "false"
      QA_MODE: "true"
      PORT: "3000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: |
          npm run check
          node --check public/app.js

      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Start application
        run: |
          node server.js > /tmp/novabank.log 2>&1 &
          echo $! > /tmp/novabank.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              echo "Application is healthy."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Application did not become healthy."
          cat /tmp/novabank.log || true
          exit 1

      - name: Smoke suite
        run: npm run smoke

      - name: Ledger reconciliation
        run: npm run db:check

      - name: Server log
        if: always()
        run: cat /tmp/novabank.log || true

      - name: Stop application
        if: always()
        run: test -f /tmp/novabank.pid && kill "$(cat /tmp/novabank.pid)" || true
